site_name: DSGL documentation
site_url: https://guides.dreamfinity.org
docs_dir: docs
site_author: <Georgii Imeshkenov aka @Veritaris, georgiiimeshkenov@gmail.com>

nav:
  - Main page: index.md
  - Quickstart: quickstart.md
  - Core concepts:
      - State and reactivity: state-reactivity.md
      - Custom components: custom-components.md
      - Hot-reload agent setup: hot-reload-agent.md
      - Cookbook: cookbook.md
      - Troubleshooting: troubleshooting.md
      - Status and limitations: status-limitations.md
      - Architecture overview: architecture.md
      - Project structure: project-structure.md
  - Reference:
      - Elements overview: elements-overview.md
      - Styling: styling.md
      - Layout model: layout-model.md
      - Hooks: hooks.md

plugins:
  - search:
      lang:
        - ru
        - en

  - glightbox:

theme:
  name: material
  custom_dir: theme

  logo: assets/logo.svg
  favicon: assets/favicon.svg

  language: ru

  features:
    - navigation.top
    - navigation.path
    - toc.integrate
    - navigation.sections
    - navigation.tabs
    - search.suggest
    - content.code.select
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: dreamfinity
      accent: dreamfinity
      toggle:
        icon: material/brightness-7
        name: Темная тема

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: dreamfinity
      accent: dreamfinity
      toggle:
        icon: material/brightness-4
        name: Светлая тема

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html

watch:
  - docs